void tekenSpelBord(object o, PaintEventArgs pea)
{

    Graphics gr = pea.Graphics;
    gr.SmoothingMode = SmoothingMode.AntiAlias;

    Brush vakjesAchtergrond = new SolidBrush(Color.FromArgb(250, 250, 250));

    for (int dx = 0; dx < int.Parse(spelBordGrootte.SelectedItem.ToString()); dx++)
    {
        for (int dy = 0; dy < int.Parse(spelBordGrootte.SelectedItem.ToString()); dy++)
        {
            gr.DrawRectangle(Pens.Black, 0 + dx * vakBreedte, 0 + dy * vakHoogte, vakBreedte, vakHoogte);
            gr.FillRectangle(vakjesAchtergrond, 0 + dx * vakBreedte, 0 + dy * vakHoogte, vakBreedte, vakHoogte);


        }
    }

    Brush speler_1 = new SolidBrush(Color.FromArgb(r1, g1, b1));
    Brush speler_2 = new SolidBrush(Color.FromArgb(r2, g2, b2));
    for (int x = 0; x < bordGrootte; x++)
    {
        for (int y = 0; y < bordGrootte; y++)
        {
            if (vakjes[x, y] == 1)
            {

                gr.FillEllipse(speler_1, 0 + x * vakBreedte, 0 + y * vakHoogte, vakBreedte, vakHoogte);

            }
            if (vakjes[x, y] == 2)
            {
                gr.FillEllipse(speler_2, 0 + x * vakBreedte, 0 + y * vakHoogte, vakBreedte, vakHoogte);

            }
        }
    }
}

//functie die controleert of een zet in een bepaalde x,y-richting zorgt voor het insluiten van een steen van de tegenstander
bool zorgtVoorInsluiten(int vak_x, int vak_y, int richting_x, int richting_y)
{
    //bordgrootte bepalen
    bordGrootte = int.Parse(spelBordGrootte.SelectedItem.ToString());

    //coördinaten van vakje dat gecontroleerd wordt
    int controleren_x = vak_x + richting_x;
    int controleren_y = vak_y + richting_y;

    //ervoor zorgen dat het te controleren vakje niet buiten het bord valt
    if (controleren_x >= 0 && controleren_y >= 0 && controleren_x < bordGrootte && controleren_y < bordGrootte)
    {
        //controleren of eerste vakje in gekozen richting een schijf van de tegenstander bevat
        if (vakjes[controleren_x, controleren_y] == huidigeSpeler || vakjes[controleren_x, controleren_y] == 0)
        {
            return false;
        }
    }
    else
    {
        return false;
    }

    //ervoor zorgen dat gecontroleerd wordt zolang het te controleren vakje niet buiten het bord valt
    while (controleren_x >= 0 && controleren_y >= 0 && controleren_x < bordGrootte && controleren_y < bordGrootte)
    {
        if (vakjes[controleren_x, controleren_y] == huidigeSpeler)
        {
            return true;
        }

        if (vakjes[controleren_x, controleren_y] == 0)
        {
            return false;
        }

        controleren_x += richting_x;
        controleren_y += richting_y;
    }
    return false;
}

//richting omdraaien om alle schijfjes te kunnen controleren
void draaiRichtingOm(int vak_x, int vak_y, int richting_x, int richting_y)
{
    int x = vak_x + richting_x;
    int y = vak_y + richting_y;

    // draai alle stenen om totdat we weer een steen van de huidige speler tegenkomen
    while (x >= 0 && y >= 0 && x < bordGrootte && y < bordGrootte && vakjes[x, y] != huidigeSpeler)
    {
        if (vakjes[x, y] != 0)
        {
            vakjes[x, y] = huidigeSpeler;
        }

        x += richting_x;
        y += richting_y;
    }
}

bool isGeldigeZet(int x, int y)
{
    if (vakjes[x, y] != 0)
        return false;

    int[] richtingen = { -1, 0, 1 };

    foreach (int rx in richtingen)
    {
        foreach (int ry in richtingen)
        {
            if (rx == 0 && ry == 0) continue;

            if (zorgtVoorInsluiten(x, y, rx, ry))
                return true;
        }
    }

    return false;
}

void flipSchijfjes(int vak_x, int vak_y, int richting_x, int richting_y)
{
    //coordinaten om te controleren
    int controleren_x = vak_x + richting_x;
    int controleren_y = vak_y + richting_y;

    //checken dat er daadwerkelijk ingesloten wordt
    if (!zorgtVoorInsluiten(vak_x, vak_y, richting_x, richting_y))
        return;

    //alles omdraaien tot we een eigen kleur tegenkomen
    while (vakjes[controleren_x, controleren_y] != huidigeSpeler)
    {
        vakjes[controleren_x, controleren_y] = huidigeSpeler;
        controleren_x += richting_x;
        controleren_y += richting_y;

    }

}

// ook flippen als door een flip een steen wordt ingesloten
bool blijfFlippen(int vak_x, int vak_y)
{
    bool isGeflipt = false;
    int[] richtingen = { -1, 0, 1 };

    foreach (int richting_x in richtingen)
    {
        foreach (int richting_y in richtingen)
        {
            if (richting_x == 0 && richting_y == 0) continue;

            if (zorgtVoorInsluiten(vak_x, vak_y, richting_x, richting_y))
            {
                draaiRichtingOm(vak_x, vak_y, richting_x, richting_y);
                isGeflipt = true;
            }
        }
    }
    return isGeflipt;
}

void doeZet(int vak_x, int vak_y)
{
    if (!isGeldigeZet(vak_x, vak_y)) return;

    vakjes[vak_x, vak_y] = huidigeSpeler;

    int[] richtingen = { -1, 0, 1 };

    // flipt schijfjes als ze ingesloten zijn
    foreach (int rx in richtingen)
    {
        foreach (int ry in richtingen)
        {
            if (rx == 0 && ry == 0) continue;

            if (zorgtVoorInsluiten(vak_x, vak_y, rx, ry))
            {
                flipSchijfjes(vak_x, vak_y, rx, ry);
            }
        }
    }
    // blijf flippen zolang er nieuwe insluitingen ontstaan
    while (blijfFlippen(vak_x, vak_y))
    {

    }
}

//checken of er überhaupt geldige zetten zijn
bool heeftGeldigeZet(int speler)
{
    for (int x = 0; x < bordGrootte; x++)
    {
        for (int y = 0; y < bordGrootte; y++)
        {
            if (vakjes[x, y] == 0)
            {
                // tijdelijk huidigeSpeler aanpassen
                int oudeSpeler = huidigeSpeler;

                bool geldig = isGeldigeZet(x, y);

                huidigeSpeler = oudeSpeler;

                if (geldig)
                    return true;
            }
        }
    }
    return false;
}
void wieIsAanDeBeurt(int huidgespeler)
{
    if (huidgespeler == 2)
        weergaveStatus.Text = $"{kleurSpeler_2.SelectedItem} is aan de beurt!";
    else weergaveStatus.Text = $"{kleurSpeler_1.SelectedItem} is aan de beurt!";
    weergaveStatus.Invalidate();
}

// muisklik tracken
void klik(object o, MouseEventArgs mea)
{
    int vak_x = mea.X / vakBreedte;
    int vak_y = mea.Y / vakHoogte;
    System.Diagnostics.Debug.WriteLine($"{vak_x} {vak_y}");

    // check of nieuwe speler een zet heeft
    if (!heeftGeldigeZet(huidigeSpeler))
    {
        MessageBox.Show($"Speler {huidigeSpeler} heeft geen geldige zetten en moet overslaan.");

        // speler opnieuw wisselen
        huidigeSpeler = 3 - huidigeSpeler;
        wieIsAanDeBeurt(huidigeSpeler);
        spelBord.Invalidate();

        // check of deze speler ook geen zetten heeft
        if (!heeftGeldigeZet(huidigeSpeler))
        {
            MessageBox.Show("Geen van beide spelers heeft nog geldige zetten. Het spel is afgelopen.");
            if (aantalStenenRood > aantalStenenBlauw)
            {
                weergaveStatus.Text = $"{kleurSpeler_2.SelectedItem} wint!";
                MessageBox.Show($"{kleurSpeler_2.SelectedItem} heeft gewonnen!");
            }

            if (aantalStenenBlauw > aantalStenenRood)
            {
                weergaveStatus.Text = $"{kleurSpeler_1.SelectedItem} wint!";
                MessageBox.Show($"{kleurSpeler_1.SelectedItem} heeft gewonnen!");
            }

            if (aantalStenenRood == aantalStenenBlauw)
            {
                weergaveStatus.Text = "Het is gelijkspel";
                MessageBox.Show("Het is gelijkspel");
            }
        }
        return;
    }

    if (!isGeldigeZet(vak_x, vak_y))
        return;
    doeZet(vak_x, vak_y);
    huidigeSpeler = 3 - huidigeSpeler;
    wieIsAanDeBeurt(huidigeSpeler);

    totaalAantalStenen = aantalStenenBlauw + aantalStenenRood + 1;
    System.Diagnostics.Debug.WriteLine($"{totaalAantalStenen}");


    hoeveelStenen();
    spelBord.Invalidate();
    checkVoorAfgelopen(totaalAantalStenen);
}


void hoeveelStenen()
{
    aantalStenenBlauw = 0;
    aantalStenenRood = 0;

    for (int x = 0; x < bordGrootte; x++)
    {
        for (int y = 0; y < bordGrootte; y++)
        {
            if (vakjes[x, y] == 1)
                aantalStenenBlauw += 1;
            if (vakjes[x, y] == 2)
                aantalStenenRood += 1;
        }
    }

    weergaveAantalStenenBlauw.Text = $"{kleurSpeler_1.SelectedItem}: {aantalStenenBlauw} stenen";
    weergaveAantalStenenRood.Text = $"{kleurSpeler_2.SelectedItem}: {aantalStenenRood} stenen";
}

void startNieuwSpel(object o, EventArgs ea)
{
    bordGrootte = int.Parse(spelBordGrootte.SelectedItem.ToString());
    updateBordGrootteLabel(bordGrootte);

    vakjes = new int[bordGrootte, bordGrootte];

    for (int x = 0; x < bordGrootte; x++)
    {
        for (int y = 0; y < bordGrootte; y++)
        {
            vakjes[x, y] = 0;
        }
    }

    // startstenen opnieuw plaatsen
    vakjes[bordGrootte / 2 - 1, bordGrootte / 2 - 1] = 1;
    vakjes[bordGrootte / 2, bordGrootte / 2 - 1] = 2;
    vakjes[bordGrootte / 2 - 1, bordGrootte / 2] = 2;
    vakjes[bordGrootte / 2, bordGrootte / 2] = 1;

    spelBord.Invalidate();
    hoeveelStenen();

    huidigeSpeler = 1;
    weergaveStatus.Text = $"{kleurSpeler_1.SelectedItem} begint aan zet";
}

void helpKnopAanpassen(object o, EventArgs ea)
{
    if (help.Text == "Help")
    {
        spelBord.Paint += helpTeken;
        help.Text = "Deactiveer hulp";
        spelBord.Invalidate();
        return;
    }

    if (help.Text == "Deactiveer hulp")
    {
        spelBord.Paint -= helpTeken;
        help.Text = "Help";
        spelBord.Invalidate();
        return;
    }
}

// tekenen van cirkels bij inklikken helpknop
void helpTeken(object o, PaintEventArgs pea)
{
    Graphics gr = pea.Graphics;
    gr.SmoothingMode = SmoothingMode.AntiAlias;

    for (int x = 0; x < bordGrootte; x++)
    {
        for (int y = 0; y < bordGrootte; y++)
        {
            if (isGeldigeZet(x, y))
            {
                gr.DrawEllipse(Pens.Black, 5 + x * vakBreedte, 5 + y * vakHoogte, 40, 40);
            }
        }
    }
}

void checkVoorAfgelopen(int totaalAantalStenen)
{
    //checken hoeveel vakjes gevuld zijn en spel stoppen indien bord vol is
    if (totaalAantalStenen == bordGrootte * bordGrootte)
    {
        spelBord.Invalidate();
        MessageBox.Show("Het bord is vol!");

        if (aantalStenenRood > aantalStenenBlauw)
        {
            weergaveStatus.Text = $"{kleurSpeler_2.SelectedItem} wint!";
            MessageBox.Show($"{kleurSpeler_2.SelectedItem} heeft gewonnen!");
        }

        if (aantalStenenBlauw > aantalStenenRood)
        {
            weergaveStatus.Text = $"{kleurSpeler_1.SelectedItem} wint!";
            MessageBox.Show($"{kleurSpeler_1.SelectedItem} heeft gewonnen!");
        }

        if (aantalStenenRood == aantalStenenBlauw)
        {
            weergaveStatus.Text = "Het is gelijkspel";
            MessageBox.Show("Het is gelijkspel");
        }

    }
}

void kiesKleur(object o, PaintEventArgs pea)
{
    if (kleurenKeuze.Text == "Terug naar spel")
    {
        Graphics gr = pea.Graphics;
        gr.SmoothingMode = SmoothingMode.AntiAlias;

        Brush speler_1 = new SolidBrush(Color.FromArgb(r1, g1, b1));
        Brush speler_2 = new SolidBrush(Color.FromArgb(r2, g2, b2));
        gr.FillEllipse(speler_1, 100, 100, 150, 150);
        gr.FillEllipse(speler_2, 300, 100, 150, 150);

    }
}
