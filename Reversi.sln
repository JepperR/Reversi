void updateBordGrootteLabel(int bordGrootte)
{
    int bordGroottePixels = bordGrootte * 50 + 1;

    Bitmap plaatje_spelBord = new Bitmap(bordGroottePixels, bordGroottePixels);

    spelBord.Size = new Size(bordGroottePixels, bordGroottePixels);
    spelBord.Image = plaatje_spelBord;

    spelBord.Location = new Point(270 + (520 - bordGroottePixels) / 2,
        (640 - bordGroottePixels) / 2);

}
