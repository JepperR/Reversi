//check tegen dubbele kleuren en voorkomen dat het spel dan doorgaat
void checkVoorDubbel(object o, EventArgs ea)
{
    if (kleurSpeler_1.SelectedItem == kleurSpeler_2.SelectedItem)
    {
        scherm.Controls.Remove(kleurenKeuze);
        oepsieDubbel.Location = new Point(200, 440);
        oepsieDubbel.ForeColor = Color.Red;
        oepsieDubbel.Text = "De schijfjes mogen niet dezelfde kleur hebben!";
        oepsieDubbel.Size = new Size(200, 100);
        scherm.Controls.Add(oepsieDubbel);
        oepsieDubbel.Parent = kleurenLabel;
        kleurenLabel.Invalidate();
    }
    else
    {
        scherm.Controls.Add(kleurenKeuze);
        oepsieDubbel.Text = "";
    }

}

kleurSpeler_1.SelectionChangeCommitted += checkVoorDubbel;
kleurSpeler_2.SelectionChangeCommitted += checkVoorDubbel;
