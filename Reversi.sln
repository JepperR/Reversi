//tekenen van onderdelen van interface
void tekenenInterface(object o, PaintEventArgs pea)
{
    Graphics gr = pea.Graphics;
    gr.SmoothingMode = SmoothingMode.AntiAlias;

    //tekenen panelen
    Brush panel = new SolidBrush(Color.FromArgb(255, 255, 255));

    gr.FillRectangle(panel, 20, 20, 220, 600);
    gr.FillRectangle(panel, 260, 20, 535, 600);

    Brush rood = new SolidBrush(Color.Red);
    Brush blauw = new SolidBrush(Color.Blue);

    Pen grijs = new Pen(Color.FromArgb(107, 114, 128));

    //status
    gr.DrawLine(grijs, 75, 39, 220, 39);

    //stand
    gr.FillEllipse(rood, 30, 130, 14, 14);
    gr.FillEllipse(blauw, 30, 155, 14, 14);

    gr.DrawLine(grijs, 75, 110, 220, 110);


    //instellingen
    gr.DrawLine(grijs, 100, 210, 220, 210);

    //acties
    gr.DrawLine(grijs, 75, 330, 220, 330);
}

